name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MAIN
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true
          fetch-depth: 1

      - name: VERIFY SOURCE
        run: |
          echo "===== COMMIT ====="
          git rev-parse HEAD
          echo "===== FILE ====="
          wc -l app/src/main/java/com/cel/ssdac/MainActivity.java
          echo "===== LINES 455-470 ====="
          sed -n '455,470p' app/src/main/java/com/cel/ssdac/MainActivity.java

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build Debug APK
        run: gradle clean assembleDebug --stacktrace

      - name: Show APK
        if: success()
        run: |
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SSDAC-Analyzer-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

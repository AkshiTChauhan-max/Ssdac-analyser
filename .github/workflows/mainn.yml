name: Unzip ZIP to Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found"
            exit 1
          fi

          mkdir extracted
          unzip -o "$ZIP" -d extracted

      - name: Copy project to repository
        run: |
          cp -r extracted/SSDAC_Analyzer/* .
          cp -r extracted/SSDAC_Analyzer/.[!.]* . 2>/dev/null || true

      - name: Remove ZIP
        run: |
          rm -f ./*.zip

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Extract SSDAC Analyzer project"
          git push

name: Extract Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          echo "Found ZIP: $ZIP"

          mkdir -p temp
          unzip -o "$ZIP" -d temp

      - name: Copy project
        run: |
          cp -a temp/SSDAC_Analyzer/. .
          rm -rf temp
          rm -f ./*.zip

      - name: Commit files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract Android project" || true
          git push

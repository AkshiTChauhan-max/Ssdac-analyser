name: Extract Project

on:
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          echo "ZIP = $ZIP"

          rm -rf extracted
          mkdir extracted

          unzip -o "$ZIP" -d extracted

      - name: Copy project to root
        run: |
          rsync -av \
            extracted/SSDAC_Analyzer/ \
            ./ \
            --exclude='.git'

      - name: Remove ZIP and temporary files
        run: |
          rm -f ./*.zip
          rm -rf extracted

      - name: Check files
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== APP ==="
          ls -la app || true

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -f

          git status

          git commit -m "Extract SSDAC Analyzer project" || echo "Nothing to commit"

          git push

name: Unzip

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip "*.zip" -d extracted

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: extracted-project
          path: extracted/
